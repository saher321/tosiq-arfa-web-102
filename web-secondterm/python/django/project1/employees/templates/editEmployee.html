<html>
  <head>
    <title>Employees in Django</title>
    <style>
      .messages {
        background-color: #c7f9a4;
        padding: 4px;
        border-radius: 4px;
        color: #517f38;
        margin: 12px 0px;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <a href="{% url 'employees' %}">Back to Employees </a>
    <h1>Edit employee [#{{ emp.id }}]</h1>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div{% if message.tags %} class=""{% endif %}>{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form action="{% url 'edit-employee' emp.id %}" method="post">
      {% csrf_token %}
      <table border="1" cellspacing="0" cellpadding="10">
        <tr align="left">
          <th>Employee Id</th>
          <td>
            <input type="number" value="{{ emp.emp_id }}" placeholder="Enter emp id" name="empid" />
          </td>
        </tr>
        <tr align="left">
          <th>Full name</th>
          <td>
            <input type="text" name="fname" value="{{ emp.full_name }}" placeholder="Enter employee full name" />
          </td>
        </tr>
        <tr align="left">
          <th>Email</th>
          <td>
            <input type="email" name="email" value="{{ emp.email }}" placeholder="Enter your email" />
          </td>
        </tr>
        <tr align="left">
          <th>Contact no</th>
          <td>
            <input type="number" name="contact" value="{{ emp.contact }}" placeholder="Enter your phone no" />
          </td>
        </tr>
        <tr>
          <th></th>
          <td>
            <button type="submit">Edit employee</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
