<html>
    <head> 
        <title>Employees in Django</title>
    </head>
    <body>
        <h1>Employees</h1>
        <table border="1" cellspacing="0" cellpadding="10">
            <thead>
                <tr>
                    <th>Sr</th>
                    <th>Emp id</th>
                    <th>Full name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                    {% for emp in employees %}
                        <tr>
                            <td>{{ emp.id }}</td>
                            <td>{{ emp.emp_id }}</td>
                            <td>{{ emp.full_name }}</td>
                            <td>{{ emp.email }}</td>
                            <td>
                                <a href={% url 'employee-details' emp.id %}>
                                    View
                                </a> &nbsp; | &nbsp; 
                                <a href={% url 'delete-employee' emp.id %}>
                                    Delete
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
            </tbody>
        </table>
    </body>
</html>
